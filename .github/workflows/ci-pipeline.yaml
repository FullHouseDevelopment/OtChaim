name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Shared development guard
    uses: FullHouseDevelopment/CommonWork/.github/workflows/profile-guard.yml@377760babc7734e5fd20c22558b05e6753fe3311
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      tier: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'heavy' || 'light' }}
      require_concurrency: true
      pr_body: ${{ github.event.pull_request.body || '' }}
      pr_number: ${{ github.event.pull_request.number || 0 }}
    permissions:
      contents: read
      pull-requests: read

  headless:
    name: Headless .NET validation
    needs: [guard]
    uses: FullHouseDevelopment/CommonWork/.github/workflows/profile-dotnet.yml@377760babc7734e5fd20c22558b05e6753fe3311
    with:
      ref: ${{ github.sha }}
      tier: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'heavy' || 'light' }}
      runner: ubuntu-latest
      global_json_file: global.json
      setup_command: bash scripts/ci-configure-nuget.sh
      restore_command: dotnet restore OtChaim.NoGUI.slnf
      build_command: dotnet build OtChaim.NoGUI.slnf --configuration NoGUI --no-restore
      test_command: |
        set -euo pipefail
        mkdir -p artifacts/ci/headless
        dotnet test OtChaim.NoGUI.slnf \
          --configuration NoGUI \
          --no-build \
          --no-restore \
          --logger 'trx;LogFilePrefix=headless' \
          --results-directory artifacts/ci/headless \
          --collect:'XPlat Code Coverage;Format=opencover' \
          --verbosity normal
      test_results_path: artifacts/ci/headless/**
      artifact_name: otchaim-headless-results
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  maui:
    name: MAUI product validation / main
    needs: [guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: FullHouseDevelopment/CommonWork/.github/workflows/profile-maui.yml@377760babc7734e5fd20c22558b05e6753fe3311
    with:
      ref: ${{ github.sha }}
      tier: heavy
      global_json_file: global.json
      headless_enabled: false

      android_enabled: true
      android_runner: ubuntu-latest
      android_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-android --skip-manifest-update
      android_restore_command: dotnet restore OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj
      android_build_command: dotnet build OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj --configuration Release --framework net8.0-android --no-restore
      android_test_command: find OtChaim.Presentation.MAUI/bin/Release/net8.0-android -type f -name 'OtChaim.Presentation.MAUI.dll' -print -quit | grep -q .

      windows_enabled: true
      windows_runner: windows-latest
      windows_setup_command: |
        bash scripts/ci-configure-nuget.sh
        dotnet workload install maui-windows --skip-manifest-update
      windows_restore_command: dotnet restore OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj -p:OtChaimWindowsOnly=true
      windows_build_command: dotnet build OtChaim.Presentation.MAUI/OtChaim.Presentation.MAUI.csproj --configuration Release --framework net8.0-windows10.0.19041.0 -p:OtChaimWindowsOnly=true
      windows_test_command: find OtChaim.Presentation.MAUI/bin/Release/net8.0-windows10.0.19041.0 -type f -name 'OtChaim.Presentation.MAUI.dll' -print -quit | grep -q .
    secrets:
      nuget_token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

  ci-gate:
    name: CI gate
    if: always()
    needs: [guard, headless, maui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require version policy and product validation
        shell: bash
        env:
          GUARD: ${{ needs.guard.result }}
          HEADLESS: ${{ needs.headless.result }}
          MAUI: ${{ needs.maui.result }}
        run: |
          set -euo pipefail
          [[ "$GUARD" == 'success' && "$HEADLESS" == 'success' ]] || {
            echo "Required development CI failed: guard=$GUARD headless=$HEADLESS" >&2
            exit 1
          }

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            [[ "$MAUI" == 'success' ]] || { echo "Required main MAUI validation: $MAUI" >&2; exit 1; }
          else
            [[ "$MAUI" == 'skipped' ]] || { echo "MAUI unexpectedly ran in development CI: $MAUI" >&2; exit 1; }
          fi

          echo 'OtChaim CI passed.'

  version-tag:
    name: Advance version tag
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    uses: FullHouseDevelopment/CommonWork/.github/workflows/version-tag.yml@377760babc7734e5fd20c22558b05e6753fe3311
    with:
      head: ${{ github.sha }}
      branch: main
    permissions:
      contents: write
      pull-requests: read
